<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>VideoWren</title>
    <meta name="description" content="Trim, rotate, crop, speed up and join videos on your phone, then export in fixed-length parts. Works offline, nothing is uploaded." />
    <meta name="theme-color" content="#12161a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="VideoWren" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <!-- Dark from the first byte, so the page is never a blank white screen while (or if) the app fails to load. -->
    <style>
      html,
      body {
        margin: 0;
        background: #12161a;
        color: #e8edf0;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      #boot {
        padding: 32px 20px;
        line-height: 1.5;
        color: #8b99a5;
      }
      #boot h2 {
        color: #e8edf0;
        margin: 0 0 8px;
      }
      #boot pre {
        white-space: pre-wrap;
        word-break: break-word;
        color: #e8edf0;
        font-size: 13px;
        background: #1c2329;
        padding: 12px;
        border-radius: 10px;
        user-select: text;
        -webkit-user-select: text;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot">Loading…</div>
    <noscript><p style="padding: 20px">VideoWren needs JavaScript.</p></noscript>
    <!-- Plain (non-module) script on purpose: it still runs when the app bundle fails to load or to start. -->
    <script>
      (function () {
        var problems = [];
        window.addEventListener(
          'error',
          function (e) {
            var t = e.target;
            if (t && t !== window && (t.src || t.href)) problems.push('failed to load ' + (t.src || t.href));
            else problems.push((e.message || 'error') + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : ''));
          },
          true,
        );
        window.addEventListener('unhandledrejection', function (e) {
          problems.push('promise: ' + ((e.reason && e.reason.message) || e.reason));
        });
        function show() {
          var b = document.getElementById('boot');
          if (!b) return;
          b.innerHTML = '<h2>VideoWren could not start</h2><p>If this keeps happening, send this text to the developer:</p><pre></pre>';
          b.querySelector('pre').textContent = navigator.userAgent + '\n\n' + (problems.join('\n') || 'No error was reported. The app script did not finish starting.');
        }
        window.__pocketCutBootFailed = show;
        if (!('noModule' in HTMLScriptElement.prototype)) {
          problems.push('This browser is too old for modules.');
          show();
        }
        setTimeout(show, 6000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
