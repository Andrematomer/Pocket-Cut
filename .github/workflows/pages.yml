name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # an experimental branch, if there is one, is published next to the app at /nla/ (it rides along with every deploy of main, because the github-pages environment only accepts main)
      - name: Build the nla branch into dist/nla
        run: |
          if git ls-remote --exit-code --heads origin nla >/dev/null 2>&1; then
            git worktree add ../nla-src origin/nla
            (cd ../nla-src && npm ci && npm test && npx vite build --outDir "$GITHUB_WORKSPACE/dist/nla" --emptyOutDir && git rev-parse --short HEAD > "$GITHUB_WORKSPACE/dist/nla/build.txt")
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
